<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="6" viewBox="0 0 1280 6" role="img" aria-label="divider">
  <title>Gradient divider</title>
  <defs>
    <linearGradient id="divA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#2f81f7"/>
      <stop offset="0.75" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="6" rx="3" fill="url(#divA)"/>
</svg>
