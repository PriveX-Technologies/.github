<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="36" viewBox="0 0 1280 36" role="img" aria-label="decorative divider">
  <title>Gradient divider with nodes</title>
  <defs>
    <linearGradient id="divC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#2f81f7" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="170" y="17" width="940" height="2" rx="1" fill="url(#divC)"/>
  <g fill="none" stroke="#2f81f7" stroke-width="1.2">
    <circle cx="170" cy="18" r="3.5">
      <animate attributeName="fill-opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="18" r="3.5">
      <animate attributeName="fill-opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;3.5;4.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="640" cy="18" r="4.5" fill="#7c3aed">
    <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="380" y1="18" x2="560" y2="18" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <line x1="720" y1="18" x2="900" y2="18" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 7">
    <animate attributeName="stroke-dashoffset" from="0" to="26" dur="1.6s" repeatCount="indefinite"/>
  </line>
</svg>
