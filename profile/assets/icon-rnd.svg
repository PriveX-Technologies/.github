<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" role="img" aria-label="R&amp;D icon">
  <title>Research &amp; Development</title>
  <rect x="1.25" y="1.25" width="57.5" height="57.5" rx="16" fill="#330b14"/>
  <rect x="1.25" y="1.25" width="57.5" height="57.5" rx="16" fill="none" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="27" cy="26" r="10.5" fill="none" stroke="#f43f5e" stroke-width="2.2"/>
  <line x1="35" y1="34" x2="44" y2="43" stroke="#fecdd3" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="27" cy="26" r="4" fill="none" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.4">
    <animate attributeName="r" values="3;7;3" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0.1;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="26" r="2" fill="#fecdd3">
    <animate attributeName="fill-opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
